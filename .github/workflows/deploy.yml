name: Build and Deploy Backend Service
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Check out pipeline code
      uses: actions/checkout@v4
    - name: Authenticate with Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    - name: Set up Cloud SDK environment
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
    - name: Build and Push Docker Container
      run: |
        gcloud auth configure-docker --quiet
        docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/simulation-backend:latest .
        docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/simulation-backend:latest
